<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency=".82" numOctaves="3" seed="19"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncA type="table" tableValues="0 .24"/>
      </feComponentTransfer>
    </filter>
    <linearGradient id="blueWash" x1="0" x2="1">
      <stop offset="0" stop-color="#1f74bd" stop-opacity=".62"/>
      <stop offset=".36" stop-color="#4366a8" stop-opacity=".22"/>
      <stop offset="1" stop-color="#cccdd2" stop-opacity="0"/>
    </linearGradient>
    <style>
      .heavy{font-family:Arial Black, Archivo Black, Impact, sans-serif;font-weight:900;text-transform:uppercase}
      .cond{font-family:Impact, Anton, Arial Black, sans-serif;text-transform:uppercase}
      .small{font-family:Arial, sans-serif;font-weight:700;text-transform:uppercase;letter-spacing:2px}
    </style>
  </defs>
  <rect width="1200" height="630" fill="#bfc0c6"/>
  <rect width="790" height="630" fill="#d5d9e2"/>
  <rect x="0" y="0" width="345" height="630" fill="url(#blueWash)"/>
  <ellipse cx="520" cy="315" rx="245" ry="430" fill="#262626"/>
  <ellipse cx="410" cy="328" rx="150" ry="380" fill="#6c7681" opacity=".7"/>
  <ellipse cx="585" cy="245" rx="172" ry="172" fill="#e5edf5" opacity=".9"/>
  <ellipse cx="650" cy="245" rx="54" ry="78" fill="#393534" opacity=".55"/>
  <rect x="430" y="365" width="350" height="265" fill="#2d2a29"/>
  <rect y="500" width="795" height="130" fill="#222" opacity=".88"/>
  <text class="heavy" x="-355" y="-34" font-size="74" fill="#393534" transform="translate(32 108) rotate(180)">SHEDSTAR</text>
  <text class="heavy" x="760" y="74" font-size="28" fill="#1f74bd" letter-spacing="-1">MUSIC&nbsp;&nbsp; VIDEOS&nbsp;&nbsp; MERCH&nbsp;&nbsp; TOUR</text>
  <g transform="translate(82 336)">
    <text class="heavy" x="0" y="0" font-size="46" fill="#393534" letter-spacing="-2">SHEDDING</text>
    <text class="heavy" x="0" y="45" font-size="46" fill="#393534" letter-spacing="-2">LIGHT</text>
    <rect x="4" y="62" width="232" height="42" fill="#393534"/>
    <text class="small" x="65" y="89" font-size="14" fill="#fff">LISTEN NOW</text>
  </g>
  <g transform="translate(820 145)">
    <rect x="-15" y="-20" width="360" height="455" fill="#f1f0ec" opacity=".22"/>
    <g class="panel">
      <rect x="0" y="0" width="102" height="92" fill="#393534"/><rect x="9" y="9" width="84" height="50" fill="#fff"/><text class="small" x="9" y="78" font-size="12" fill="#fff">ABOUT</text>
      <rect x="118" y="0" width="102" height="92" fill="#1f74bd"/><rect x="127" y="9" width="84" height="50" fill="#fff"/><text class="small" x="127" y="78" font-size="12" fill="#fff">MUSIC</text>
      <rect x="236" y="0" width="102" height="92" fill="#4366a8"/><rect x="245" y="9" width="84" height="50" fill="#fff"/><text class="small" x="245" y="78" font-size="12" fill="#fff">VIDEOS</text>
      <rect x="0" y="116" width="102" height="92" fill="#95ae9b"/><rect x="9" y="125" width="84" height="50" fill="#fff"/><text class="small" x="9" y="194" font-size="12" fill="#fff">MERCH</text>
      <rect x="118" y="116" width="102" height="92" fill="#bfc0c6"/><rect x="127" y="125" width="84" height="50" fill="#fff"/><text class="small" x="127" y="194" font-size="12" fill="#393534">E-BOOKS</text>
      <rect x="236" y="116" width="102" height="92" fill="#393534"/><rect x="245" y="125" width="84" height="50" fill="#fff"/><text class="small" x="245" y="194" font-size="12" fill="#fff">TOUR</text>
      <rect x="0" y="232" width="102" height="92" fill="#1f74bd"/><rect x="9" y="241" width="84" height="50" fill="#fff"/><text class="small" x="9" y="310" font-size="12" fill="#fff">GALLERY</text>
      <rect x="118" y="232" width="102" height="92" fill="#95ae9b"/><rect x="127" y="241" width="84" height="50" fill="#fff"/><text class="small" x="127" y="310" font-size="12" fill="#fff">NEWS</text>
      <rect x="236" y="232" width="102" height="92" fill="#4366a8"/><rect x="245" y="241" width="84" height="50" fill="#fff"/><text class="small" x="245" y="310" font-size="12" fill="#fff">BOOKING</text>
    </g>
    <rect x="0" y="355" width="338" height="58" fill="#393534"/>
